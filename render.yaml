services:
  - type: web
    name: 2go-2-0-web
    env: node
    plan: starter
    rootDir: .
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: 2go-2-0-db
          property: connectionString
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: API_BASE_URL
        value: ""

databases:
  - name: 2go-2-0-db
    plan: starter
