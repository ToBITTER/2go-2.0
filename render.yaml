services:
  - type: web
    name: 2go-2-0-web
    env: node
    plan: starter
    rootDir: .
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: 2go-2-0-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: 2go-2-0-api
    env: node
    plan: starter
    rootDir: server
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: 2go-2-0-db
          property: connectionString

databases:
  - name: 2go-2-0-db
    plan: starter
